[project]
name = "indexcache-mlx"
version = "0.1.0"
description = "IndexCache-style cross-layer top-k index reuse for a DSA-like sparse attention, in MLX"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
